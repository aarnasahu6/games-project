<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Guesser: Berkeley</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f5f3ee; --panel: #ffffff; --ink: #1c2230; --muted: #667085; --line: #dfe2e8;
    --brand: #003262; --brand-ink: #fff; --gold: #fdb515; --gold-ink: #3a2a00; --btn: #eef1f6; --btn-h: #e2e7ef;
    --good: #1f8a4c; --ok: #b7791f; --bad: #c43d3d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --panel: #1b2029; --ink: #e8ebf1; --muted: #9aa3b2; --line: #2e3542;
      --brand: #4f86c6; --btn: #262c38; --btn-h: #303848; --good: #5fd08d; --ok: #f0b454; --bad: #ff8585; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; }
  header { background: var(--brand); color: var(--brand-ink); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; flex: 1; min-width: 180px; }
  .pill { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .pill b { color: var(--gold); }
  .layout { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  #map { min-height: 300px; background: #d9dee6; }
  .label { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .target { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .clue { font-size: 16px; margin: 0 0 12px; }
  .tip { color: var(--muted); font-size: 13px; }
  button.b { font: inherit; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 14px; cursor: pointer; }
  button.b:hover { background: var(--btn-h); }
  button.b.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  button.b.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; }
  button.b:disabled { opacity: .45; cursor: default; }
  button.b.wide { width: 100%; margin-top: 10px; padding: 11px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 6px 0 14px; }
  .seg button { flex: 1; font: inherit; border: 0; background: var(--panel); color: var(--ink); padding: 9px 6px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .seg small { display: block; font-size: 11px; opacity: .8; font-weight: 400; }
  .result { border-radius: 10px; padding: 12px; margin-top: 12px; background: var(--bg); }
  .result .pts { font-size: 30px; font-weight: 800; }
  .result .dist { color: var(--muted); }
  .result .fact { margin-top: 8px; }
  .bar { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 6px 0; }
  .bar div { height: 100%; background: var(--gold); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0; }
  td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .big { font-size: 42px; font-weight: 800; color: var(--brand); line-height: 1.1; }
  .notice { background: #fff4d6; color: #5a4300; border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 10px; display: none; }
  .mapctl { position: absolute; z-index: 500; right: 10px; top: 10px; display: flex; gap: 0; border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .mapctl button { font: 13px/1 inherit; border: 0; background: #fff; color: #1c2230; padding: 8px 10px; cursor: pointer; }
  .mapctl button.on { background: #003262; color: #fff; }
  .mapwrap { position: relative; min-height: 0; display: flex; flex-direction: column; }
  .mapwrap #map { flex: 1; }
  .pin { width: 18px; height: 18px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .pin.guess { background: #2f6fdb; } .pin.truth { background: #fdb515; }
  .leaflet-container { font: inherit; cursor: crosshair; }
  footer { font-size: 11.5px; color: var(--muted); padding: 10px 0 0; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 46vh; }
    .mapwrap { min-height: 52vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Campus Guesser: Berkeley</h1>
  <span class="pill">Round <b id="h-round">–</b> / 5</span>
  <span class="pill">Score <b id="h-score">0</b></span>
  <span class="pill">Best <b id="h-best">0</b></span>
</header>
<div class="layout">
  <aside id="panel"></aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="mapctl" id="mapctl">
      <button data-style="sat" class="on">Satellite</button>
      <button data-style="map">Map</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Coordinates from Wikipedia and a public UC Berkeley landmark list (averaged where both exist).
const PLACES = [
  { name: 'Sather Tower (the Campanile)', lat: 37.87214, lng: -122.25787, clue: 'A 307-foot bell-and-clock tower finished in 1914. Its carillon bells ring out over campus every day.' },
  { name: 'Sather Gate', lat: 37.87022, lng: -122.25954, clue: 'A bronze gate completed in 1910 and a backdrop of the 1964 Free Speech Movement.' },
  { name: 'Wheeler Hall', lat: 37.87116, lng: -122.2591, clue: 'Opened in 1917. Home to the largest lecture hall on campus.' },
  { name: 'Doe Memorial Library', lat: 37.87244, lng: -122.25956, clue: 'A neoclassical library completed in 1911. It holds the Mark Twain Papers.' },
  { name: 'Sproul Plaza', lat: 37.86956, lng: -122.25905, clue: 'Designed in 1962. Mario Savio spoke from the steps here in 1964, and clubs still table here every day.' },
  { name: 'Hearst Memorial Mining Building', lat: 37.87433, lng: -122.25719, clue: 'Built 1902–1907 by John Galen Howard. Today it houses Materials Science and Engineering.' },
  { name: 'Evans Hall', lat: 37.87363, lng: -122.25783, clue: 'A 1971 concrete tower named after a math chair. Berkeley RISC processors and the Berkeley sockets library were developed here.' },
  { name: 'California Memorial Stadium', lat: 37.87122, lng: -122.25072, clue: 'Opened in November 1923, in time to host that year’s Big Game against Stanford. The top rows look out over the Bay.' },
  { name: 'Hearst Greek Theatre', lat: 37.87362, lng: -122.25426, clue: 'Opened in 1903 with a student production of Aristophanes’ The Birds. Now it hosts concerts and graduations.' },
  { name: 'Zellerbach Hall', lat: 37.86897, lng: -122.26103, clue: 'Completed in 1968. The main stage for Cal Performances: dance, theater, opera and concerts.' },
  { name: 'Durant Hall', lat: 37.87126, lng: -122.26013, clue: 'Dedicated in 1911 as the law school, it was renamed for the university’s first president after the law school moved out in 1951.' },
  { name: 'Giannini Hall', lat: 37.87356, lng: -122.26235, clue: 'Built in 1930 as a gift from the founder of the Bank of Italy, which later became Bank of America.' },
  { name: 'Hilgard Hall', lat: 37.87323, lng: -122.2634, clue: 'Named for the first dean of the College of Agriculture, who led it from 1874 to 1904.' },
  { name: 'International House', lat: 37.86964, lng: -122.25173, clue: 'Opened in 1930 as a gift from John D. Rockefeller Jr. Around 600 students from dozens of countries live here.' },
  { name: 'Hearst Museum of Anthropology (Kroeber Hall)', lat: 37.8698, lng: -122.25517, clue: 'A museum with an estimated 3 million objects. It moved here from San Francisco in 1931.' },
  { name: 'South Hall', lat: 37.87133, lng: -122.2585, clue: 'Built in 1873, the oldest building on campus. The first physics lab in the US opened here in 1879.' },
  { name: 'California Hall', lat: 37.87189, lng: -122.26039, clue: 'One of the original Beaux-Arts buildings, opened in 1905. The Chancellor’s office is here.' },
  { name: 'Berkeley Art Museum & Pacific Film Archive', lat: 37.87103, lng: -122.2663, clue: 'Founded in 1963. Its film archive has the largest collection of Japanese films outside Japan.' },
  { name: 'Soda Hall', lat: 37.87567, lng: -122.25871, clue: 'Where CS majors spend their nights: the home of Berkeley’s Computer Science division.' },
  { name: 'Valley Life Sciences Building', lat: 37.87148, lng: -122.26211, clue: 'A huge biology building with a T. rex skeleton cast greeting you in the atrium.' },
  { name: 'Moffitt Library', lat: 37.87255, lng: -122.26081, clue: 'The undergrad library from the late 1960s. Two floors were renovated in 2016 into 24-hour study space, and the Free Speech Movement Café is at its entrance.' },
  { name: 'Dwinelle Hall', lat: 37.87058, lng: -122.26041, clue: 'Famous for being a maze: floors and wings that don’t quite line up, so everyone gets lost here at least once.' },
  { name: 'Haas School of Business', lat: 37.87169, lng: -122.25384, clue: 'Founded in 1898 as the first business school at a public university in the US.' },
  { name: 'Hearst Memorial Gymnasium', lat: 37.86956, lng: -122.25687, clue: 'A gym designed by Julia Morgan and Bernard Maybeck, known for its grand outdoor pools.' },
  { name: 'Recreational Sports Facility (RSF)', lat: 37.86865, lng: -122.2629, clue: 'The main student gym: weight rooms, courts and pools, busiest right after midterms.' },
  { name: 'Le Conte Hall', lat: 37.87249, lng: -122.25688, clue: 'The physics building, where Ernest Lawrence did early work on the cyclotron.' },
  { name: 'Pimentel Hall', lat: 37.87341, lng: -122.25602, clue: 'A big round lecture hall with a rotating stage, where huge intro chemistry and CS classes meet.' },
  { name: 'Cory Hall', lat: 37.87505, lng: -122.25752, clue: 'Home of Electrical Engineering, the “EE” in EECS.' },
  { name: 'Sutardja Dai Hall', lat: 37.87482, lng: -122.25839, clue: 'A glassy engineering building that houses CITRIS, a tech research institute, and its nanofabrication lab.' },
  { name: 'Etcheverry Hall', lat: 37.87587, lng: -122.2593, clue: 'Engineering building home to Mechanical and Nuclear Engineering.' },
  { name: 'Wurster Hall', lat: 37.8705, lng: -122.25488, clue: 'A concrete Brutalist building, home of the College of Environmental Design (architecture, planning, landscape).' },
  { name: 'Founders’ Rock', lat: 37.87536, lng: -122.257, clue: 'A rock marking where the founders of the College of California dedicated the site in 1860.' },
  { name: 'Ludwig’s Fountain', lat: 37.86957, lng: -122.25948, clue: 'A fountain named after a dachshund who hung out here every day in the 1960s.' },
  { name: 'MLK Jr. Student Union', lat: 37.86914, lng: -122.25961, clue: 'The student union building on Lower Sproul, home to the Cal Student Store.' },
  { name: 'Tang Center (University Health Services)', lat: 37.86756, lng: -122.26426, clue: 'Where students go when they get sick: the campus health center.' },
];

const ROUNDS = 5;
const CENTER = [37.8718, -122.2585];
const BOUNDS = L.latLngBounds([37.8645, -122.2685], [37.8785, -122.2475]);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('cg-' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cg-' + k, JSON.stringify(v)); } catch {} }
};

// ---------- Scoring ----------
function distance(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const points = d => d <= 20 ? 1000 : Math.round(1000 * Math.exp(-(d - 20) / 150));
const verdict = d => d <= 30 ? 'Bullseye!' : d <= 80 ? 'So close!' : d <= 200 ? 'Right neighborhood.' : d <= 400 ? 'Wrong side of the Glade.' : 'Are you sure you go here?';
const fmtDist = d => d < 1000 ? `${Math.round(d)} m` : `${(d / 1000).toFixed(2)} km`;

// ---------- Map ----------
const map = L.map('map', { center: CENTER, zoom: 16, minZoom: 15, maxZoom: 19, maxBounds: BOUNDS.pad(0.1), maxBoundsViscosity: 0.8 });
const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
const LAYERS = {
  // Esri basemaps work without an API key. "Base" canvas layers have no labels.
  map: L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark ? 'Dark' : 'Light'}_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    { maxZoom: 19, maxNativeZoom: 16, attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }),
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Imagery &copy; Esri' }),
};
let style = store.get('style2', 'sat');
let tileErrors = 0;
Object.values(LAYERS).forEach(l => l.on('tileerror', () => { if (++tileErrors === 4) showOffline(); }));
function setStyle(s) {
  style = s; store.set('style2', s);
  Object.entries(LAYERS).forEach(([k, l]) => k === s ? l.addTo(map) : map.removeLayer(l));
  document.querySelectorAll('#mapctl button').forEach(b => b.classList.toggle('on', b.dataset.style === s));
}
document.querySelectorAll('#mapctl button').forEach(b => b.onclick = e => { e.stopPropagation(); setStyle(b.dataset.style); });
L.DomEvent.disableClickPropagation($('mapctl'));
setStyle(style);
function showOffline() { const n = $('offline'); if (n) n.style.display = 'block'; }

const pinIcon = cls => L.divIcon({ className: '', html: `<div class="pin ${cls}"></div>`, iconSize: [18, 18], iconAnchor: [9, 22] });
const overlay = L.layerGroup().addTo(map);

// ---------- Game ----------
const G = { mode: store.get('mode', 'clue'), order: [], round: 0, score: 0, guess: null, revealed: false, results: [] };
let best = store.get('best', { clue: 0, name: 0 });

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function updateHeader() {
  $('h-round').textContent = G.round ? Math.min(G.round, ROUNDS) : '–';
  $('h-score').textContent = G.score;
  $('h-best').textContent = best[G.mode];
}
function home() {
  overlay.clearLayers(); map.setView(CENTER, 16);
  G.round = 0; G.score = 0; updateHeader();
  $('panel').innerHTML = `
    <div class="label">How to play</div>
    <p style="margin:0 0 10px">You get 5 places on or near campus. Click where you think each one is, then lock in your guess. The closer you are, the more points, up to 1,000 per round. The map has no labels.</p>
    <div class="label">Difficulty</div>
    <div class="seg" id="modeSeg">
      <button data-mode="name">Freshman<small>see the name</small></button>
      <button data-mode="clue">Senior<small>clue only</small></button>
    </div>
    <button class="b gold wide" id="start">Start game</button>
    <div class="notice" id="offline">The map couldn’t load. This game needs an internet connection for the map.</div>
    <p class="tip" style="margin-top:14px">Tip: switch between <b>Satellite</b> and a plain <b>Map</b> in the top right corner.</p>
    <footer>Unofficial fan game. Not affiliated with UC Berkeley. Map tiles &copy; Esri.</footer>`;
  const paintMode = () => document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === G.mode));
  document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { G.mode = b.dataset.mode; store.set('mode', G.mode); paintMode(); updateHeader(); });
  paintMode();
  $('start').onclick = start;
  if (tileErrors >= 4) showOffline();
}
function start() {
  G.order = shuffle(PLACES.slice()).slice(0, ROUNDS);
  G.round = 0; G.score = 0; G.results = [];
  nextRound();
}
function nextRound() {
  G.round++; G.guess = null; G.revealed = false;
  overlay.clearLayers(); map.setView(CENTER, 16);
  const p = G.order[G.round - 1];
  $('panel').innerHTML = `
    <div class="label">Round ${G.round} of ${ROUNDS} · Where is…</div>
    ${G.mode === 'name' ? `<p class="target">${esc(p.name)}</p><p class="clue tip">${esc(p.clue)}</p>` : `<p class="clue">${esc(p.clue)}</p>`}
    <p class="tip" id="hint">Click the map to drop your pin. You can move it before you lock in.</p>
    <button class="b primary wide" id="lock" disabled>Lock in guess</button>
    <div id="res"></div>
    <div class="notice" id="offline">The map couldn’t load. This game needs an internet connection for the map.</div>`;
  $('lock').onclick = reveal;
  if (tileErrors >= 4) showOffline();
  updateHeader();
}
map.on('click', e => {
  if (!G.round || G.revealed || G.round > ROUNDS) return;
  G.guess = e.latlng;
  overlay.clearLayers();
  L.marker(e.latlng, { icon: pinIcon('guess') }).addTo(overlay);
  $('lock').disabled = false;
  $('hint').textContent = 'Happy with it? Lock it in (or press Enter).';
});
function reveal() {
  if (!G.guess || G.revealed) return;
  G.revealed = true;
  const p = G.order[G.round - 1], d = distance(G.guess, p), pts = points(d);
  G.score += pts;
  G.results.push({ p, d, pts, guess: G.guess });
  L.marker([p.lat, p.lng], { icon: pinIcon('truth') }).addTo(overlay).bindTooltip(esc(p.name), { permanent: true, direction: 'top', offset: [0, -20] });
  L.polyline([G.guess, [p.lat, p.lng]], { color: '#fdb515', weight: 3, dashArray: '6 6' }).addTo(overlay);
  map.fitBounds(L.latLngBounds([G.guess, [p.lat, p.lng]]).pad(0.5), { maxZoom: 18 });
  const color = pts >= 800 ? 'var(--good)' : pts >= 400 ? 'var(--ok)' : 'var(--bad)';
  $('lock').remove(); $('hint').remove();
  $('res').innerHTML = `
    <div class="result">
      <div class="label">${esc(verdict(d))}</div>
      <div class="pts" style="color:${color}">+${pts}</div>
      <div class="bar"><div style="width:${pts / 10}%"></div></div>
      <div class="dist">You were <b>${fmtDist(d)}</b> from <b>${esc(p.name)}</b>.</div>
    </div>
    <button class="b gold wide" id="next">${G.round < ROUNDS ? 'Next place (Enter)' : 'See results (Enter)'}</button>`;
  $('next').onclick = G.round < ROUNDS ? nextRound : finish;
  updateHeader();
}
function finish() {
  G.round = ROUNDS + 1;
  const isBest = G.score > best[G.mode];
  if (isBest) { best[G.mode] = G.score; store.set('best', best); }
  overlay.clearLayers();
  const all = [];
  G.results.forEach((r, i) => {
    const t = [r.p.lat, r.p.lng]; all.push(t, r.guess);
    L.marker(t, { icon: pinIcon('truth') }).addTo(overlay).bindTooltip(`${i + 1}. ${esc(r.p.name)}`, { direction: 'top', offset: [0, -20] });
    L.marker(r.guess, { icon: pinIcon('guess') }).addTo(overlay);
    L.polyline([r.guess, t], { color: '#fdb515', weight: 2, dashArray: '5 5' }).addTo(overlay);
  });
  map.fitBounds(L.latLngBounds(all).pad(0.2), { maxZoom: 17 });
  const pct = G.score / (ROUNDS * 1000);
  const title = pct >= .9 ? 'Campus legend' : pct >= .7 ? 'Knows every shortcut' : pct >= .45 ? 'Solid sophomore' : pct >= .2 ? 'Still using the campus map' : 'Welcome, admitted student!';
  const share = `Campus Guesser (${G.mode === 'name' ? 'Freshman' : 'Senior'}): ${G.score}/${ROUNDS * 1000}\n` +
    G.results.map(r => r.pts >= 800 ? '■' : r.pts >= 400 ? '▣' : '□').join(' ');
  $('panel').innerHTML = `
    <div class="label">Final score · ${G.mode === 'name' ? 'Freshman' : 'Senior'}</div>
    <div class="big">${G.score}</div>
    <p style="margin:4px 0 0"><b>${title}</b>${isBest ? ' · New best!' : ` · Best: ${best[G.mode]}`}</p>
    <table>${G.results.map((r, i) => `<tr><td>${i + 1}. ${esc(r.p.name)}<br><span class="tip">${fmtDist(r.d)} away</span></td><td>${r.pts}</td></tr>`).join('')}</table>
    <button class="b wide" id="copy">Copy result</button>
    <button class="b gold wide" id="again">Play again (Enter)</button>
    <button class="b wide" id="menu">Change difficulty</button>`;
  $('copy').onclick = async () => { try { await navigator.clipboard.writeText(share); $('copy').textContent = 'Copied!'; } catch { $('copy').textContent = 'Couldn’t copy'; } };
  $('again').onclick = start;
  $('menu').onclick = home;
  updateHeader();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
  const btn = $('next') || (G.round > ROUNDS && $('again')) || ($('lock') && !$('lock').disabled && $('lock'));
  if (btn) { e.preventDefault(); btn.click(); }
});

home();
</script>
</body>
</html>
